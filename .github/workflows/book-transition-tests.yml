name: Book transition router tests

on:
  pull_request:
    paths:
      - 'scripts/book_pipeline/**'
      - 'tests/test_book_pipeline_*.py'
      - 'README.md'
      - 'docs/**'
      - 'skills/book-authoring/**'
      - 'engine/**'
      - '.github/workflows/book-transition-router.yml'
      - '.github/workflows/book-pr-scope.yml'
      - '.github/CODEOWNERS'
      - '.github/workflows/book-transition-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Offline router and issue-assignment contract tests
        run: python -m unittest discover -s tests -p 'test_book_pipeline_*.py' -v
