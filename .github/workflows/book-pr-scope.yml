name: Book PR scope

# Read-only, executes trusted default branch code; never checks out PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Inspect PR label and changed files via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BOOKS_PREFIX: ${{ vars.BOOKS_PREFIX }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/guard-pr.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            | jq -s 'add' > "$RUNNER_TEMP/guard-files.json"
          python scripts/book_pipeline/pr_scope_guard.py \
            --pr "$RUNNER_TEMP/guard-pr.json" \
            --files "$RUNNER_TEMP/guard-files.json" \
            --books-prefix "${BOOKS_PREFIX:-books}"
