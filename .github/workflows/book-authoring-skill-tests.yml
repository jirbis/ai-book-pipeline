name: book-authoring skill tests

on:
  pull_request:
    paths:
      - 'skills/book-authoring/**'
      - 'tests/test_book_authoring_skill.py'
      - 'tests/test_github_book_workspace.py'
      - '.github/workflows/book-authoring-skill-tests.yml'
      - 'engine/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing engine validator dependency
        run: python -m pip install 'PyYAML>=6.0'
      - name: Run isolated adapter integration tests
        run: python -m unittest discover -s tests -p 'test_*book*.py' -v
